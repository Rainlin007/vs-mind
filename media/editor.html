<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-eval'; img-src {{cspSource}} data: blob:; font-src {{cspSource}} data:; connect-src {{cspSource}} data: blob:;">
  <link href="{{cssUri}}" rel="stylesheet">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar" class="toolbar">
    <div class="toolbar-group">
      <button id="btn-undo" class="toolbar-btn" title="Undo">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button id="btn-redo" class="toolbar-btn" title="Redo">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button id="btn-add-child" class="toolbar-btn" title="Add Child">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button id="btn-add-sibling" class="toolbar-btn" title="Add Sibling">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 9h16v2H4zm0 4h10v2H4z"/></svg>
      </button>
      <button id="btn-delete" class="toolbar-btn" title="Delete">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button id="btn-painter" class="toolbar-btn" title="Format Painter">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M18 4V3c0-.55-.45-1-1-1H5c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h12c.55 0 1-.45 1-1V6h1v4H9v11c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-9h8V4h-3z"/></svg>
      </button>
      <button id="btn-rainbow-lines" class="toolbar-btn" title="Rainbow Lines">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12h2c0-4.41 3.59-8 8-8s8 3.59 8 8h2c0-5.52-4.48-10-10-10zm0 4c-3.31 0-6 2.69-6 6h2c0-2.21 1.79-4 4-4s4 1.79 4 4h2c0-3.31-2.69-6-6-6zm0 4c-1.1 0-2 .9-2 2h2v-2z"/></svg>
      </button>
      <button id="btn-search" class="toolbar-btn" title="Search">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <div class="toolbar-dropdown">
        <button id="btn-theme" class="toolbar-btn" title="Theme">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </button>
        <div class="dropdown-menu theme-menu" id="theme-menu"></div>
      </div>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <div class="toolbar-dropdown">
        <button id="btn-layout" class="toolbar-btn" title="Layout">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3h7zM7 9H4V5h3v4zm10 6h3v4h-3v-4zm0-10h3v4h-3V5z"/></svg>
        </button>
        <div class="dropdown-menu" id="layout-menu">
          <div class="dropdown-item" data-layout="logicalStructure">Logical</div>
          <div class="dropdown-item" data-layout="logicalStructureLeft">Logical (L)</div>
          <div class="dropdown-item" data-layout="mindMap">Mind Map</div>
          <div class="dropdown-item" data-layout="organizationStructure">Org Chart</div>
          <div class="dropdown-item" data-layout="catalogOrganization">Catalog</div>
          <div class="dropdown-item" data-layout="timeline">Timeline</div>
          <div class="dropdown-item" data-layout="fishbone">Fishbone</div>
        </div>
      </div>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button id="btn-zoom-out" class="toolbar-btn" title="Zoom Out">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <span id="zoom-level" class="toolbar-zoom-text">100%</span>
      <button id="btn-zoom-in" class="toolbar-btn" title="Zoom In">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <button id="btn-fit" class="toolbar-btn" title="Fit Canvas">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <button id="btn-expand-all" class="toolbar-btn" title="Expand All">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 5.83L15.17 9l1.41-1.41L12 3 7.41 7.59 8.83 9 12 5.83zm0 12.34L8.83 15l-1.41 1.41L12 21l4.59-4.59L15.17 15 12 18.17z"/></svg>
      </button>
      <button id="btn-collapse-all" class="toolbar-btn" title="Collapse All">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7.41 18.59L8.83 20 12 16.83 15.17 20l1.41-1.41L12 14l-4.59 4.59zm9.18-13.18L15.17 4 12 7.17 8.83 4 7.41 5.41 12 10l4.59-4.59z"/></svg>
      </button>
    </div>

    <div class="toolbar-separator"></div>

    <div class="toolbar-group">
      <div class="toolbar-dropdown">
        <button id="btn-export" class="toolbar-btn" title="Export">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
        </button>
        <div class="dropdown-menu" id="export-menu">
          <div class="dropdown-item" data-format="png">PNG</div>
          <div class="dropdown-item" data-format="svg">SVG</div>
          <div class="dropdown-item" data-format="json">JSON</div>
        </div>
      </div>
    </div>

    <div class="toolbar-group toolbar-right">
      <button id="btn-sidebar-toggle" class="toolbar-btn" title="Properties">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H8V6h12v12z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="main-content">
    <div id="mindMapContainer" class="mind-map-container"></div>

    <div id="sidePanel" class="side-panel">
      <div class="side-panel-header">
        <span id="panel-node-properties">Node Properties</span>
        <button id="btn-close-panel" class="panel-close-btn">&times;</button>
      </div>
      <div class="side-panel-body">
        <div class="panel-section">
          <label id="label-canvas-settings" class="panel-label panel-label-group">Canvas</label>
          <div class="style-row">
            <label id="label-line-width" class="style-label">Line Width</label>
            <input id="line-width" class="panel-input panel-input-sm" type="number" min="1" max="10" step="1" value="2">
          </div>
        </div>
        <div class="panel-divider"></div>
        <div class="panel-section">
          <label id="label-node-text" class="panel-label" for="node-text">Text</label>
          <textarea id="node-text" class="panel-textarea" rows="3" placeholder="Node text"></textarea>
        </div>
        <div class="panel-section">
          <label id="label-node-note" class="panel-label" for="node-note">Note</label>
          <textarea id="node-note" class="panel-textarea" rows="3" placeholder="Add a note..."></textarea>
        </div>
        <div class="panel-section">
          <label id="label-node-comment" class="panel-label" for="node-comment">Comment</label>
          <textarea id="node-comment" class="panel-textarea" rows="3" placeholder="Not shown on the map — for your notes or AI"></textarea>
        </div>
        <div class="panel-section">
          <label id="label-node-link" class="panel-label" for="node-link">Hyperlink</label>
          <input id="node-link" class="panel-input" type="url" placeholder="https://...">
          <input id="node-link-title" class="panel-input" type="text" placeholder="Link title" style="margin-top:4px;">
        </div>
        <div class="panel-section">
          <label id="label-node-tags" class="panel-label" for="node-tag-input">Tags</label>
          <div id="node-tags" class="panel-tags"></div>
          <div class="tag-input-wrapper">
            <input id="node-tag-input" class="panel-input" type="text" placeholder="Type a tag and press Enter">
          </div>
        </div>
        <div class="panel-section">
          <label id="label-node-shape" class="panel-label" for="node-shape">Shape</label>
          <select id="node-shape" class="panel-select">
            <option value="">Default</option>
            <option value="rectangle">Rectangle</option>
            <option value="roundedRectangle">Rounded Rectangle</option>
            <option value="diamond">Diamond</option>
            <option value="ellipse">Ellipse</option>
            <option value="circle">Circle</option>
            <option value="parallelogram">Parallelogram</option>
            <option value="octagonalRectangle">Octagonal Rectangle</option>
          </select>
        </div>
        <div class="panel-section">
          <label id="label-node-style" class="panel-label">Style</label>
          <div class="style-row">
            <label id="label-node-color" class="style-label">Font Color</label>
            <input id="node-color" class="panel-color" type="color" value="#333333">
          </div>
          <div class="style-row">
            <label id="label-node-bg-color" class="style-label">Background</label>
            <input id="node-bg-color" class="panel-color" type="color" value="#ffffff">
          </div>
          <div class="style-row">
            <label id="label-node-font-size" class="style-label">Font Size</label>
            <input id="node-font-size" class="panel-input panel-input-sm" type="number" min="10" max="72" value="14">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Panel -->
  <div id="searchPanel" class="search-panel hidden">
    <div class="search-row">
      <input id="search-input" class="search-input" type="text" placeholder="Search nodes...">
      <button id="btn-search-prev" class="search-btn" title="Previous">&#8593;</button>
      <button id="btn-search-next" class="search-btn" title="Next">&#8595;</button>
      <span id="search-count" class="search-count"></span>
      <button id="btn-search-close" class="search-btn search-close-btn" title="Close">&times;</button>
    </div>
    <div class="search-row">
      <input id="replace-input" class="search-input" type="text" placeholder="Replace with...">
      <button id="btn-replace" class="search-btn" title="Replace">Replace</button>
      <button id="btn-replace-all" class="search-btn" title="Replace All">All</button>
    </div>
  </div>

  <div id="contextMenu" class="context-menu" style="display:none;"></div>

  <!-- Formula input dialog -->
  <div id="formulaDialog" class="formula-dialog hidden">
    <div class="formula-dialog-panel">
      <div id="formula-dialog-title" class="formula-dialog-title">Insert Formula</div>
      <div id="formula-dialog-hint" class="formula-dialog-hint">LaTeX syntax, e.g. e=mc^2 or \frac{a}{b}</div>
      <input id="formula-input" class="formula-input" type="text" spellcheck="false" autocomplete="off">
      <div class="formula-dialog-actions">
        <button type="button" id="formula-cancel" class="formula-btn formula-btn-secondary">Cancel</button>
        <button type="button" id="formula-confirm" class="formula-btn formula-btn-primary">Insert</button>
      </div>
    </div>
  </div>

  <div id="statusBar" class="status-bar">
    <span id="status-nodes">Nodes: 0</span>
    <span id="status-zoom">Zoom: 100%</span>
    <span class="status-shortcuts">Tab: Child | Enter: Sibling | Delete: Remove | Ctrl+Z: Undo</span>
  </div>

  <script src="{{editorUri}}"></script>
</body>
</html>
