<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;" />
  <title>VS Mind Webview Debug</title>
  <link href="../media/main.css" rel="stylesheet" />
  <link href="../media/MindElixir.css" rel="stylesheet" />
  <link href="../media/katex.min.css" rel="stylesheet" />
  <style>
    #debug-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      padding: 8px 12px;
      font: 12px/1.4 monospace;
      background: #1e1e1e;
      color: #ccc;
      border-top: 1px solid #454545;
      max-height: 120px;
      overflow: auto;
    }
    #debug-bar .pass { color: #4ec9b0; }
    #debug-bar .fail { color: #f48771; }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="workspace-column">
      <header class="map-toolbar" role="toolbar" aria-label="导出">
        <div class="toolbar-group">
          <div class="export-dropdown">
            <button id="export-trigger" class="toolbar-btn export-trigger" type="button" title="导出" aria-haspopup="menu" aria-expanded="false" aria-label="导出">
              <span class="toolbar-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="currentColor" width="16" height="16"><path d="M8.5 1.5a.5.5 0 0 0-1 0v7.793L5.354 7.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 9.293V1.5zM2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
              </span>
              <span class="toolbar-chevron" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="currentColor" width="16" height="16"><path d="M4.5 6.5 8 10l3.5-3.5L12 7.5 8 11.5 4 7.5l.5-1z"/></svg>
              </span>
            </button>
            <div id="export-menu" class="export-menu hidden" role="menu" aria-label="导出格式">
              <button class="export-menu-item" type="button" data-export="png" role="menuitem">PNG</button>
              <button class="export-menu-item" type="button" data-export="mmf" role="menuitem">MMF</button>
              <button class="export-menu-item" type="button" data-export="markdown" role="menuitem">Markdown</button>
              <button class="export-menu-item" type="button" data-export="plaintext" role="menuitem">Plaintext</button>
            </div>
          </div>
        </div>
      </header>
      <div class="map-area">
        <div id="bgPatternOverlay" class="bg-pattern-overlay"></div>
        <div id="mindmap"></div>
      </div>
    </div>
    <aside id="side-panel" class="side-panel hidden">
      <div id="side-panel-resizer" class="side-panel-resizer" title="拖动调整宽度"></div>
      <div class="side-panel-header">
        <div class="side-panel-tabs">
          <button id="panel-tab-node" class="side-panel-tab active" type="button" data-panel="node">节点</button>
          <button id="panel-tab-theme" class="side-panel-tab" type="button" data-panel="theme">全局</button>
        </div>
        <button id="btn-close-panel" class="panel-close-btn" type="button">&times;</button>
      </div>
      <div class="side-panel-body">
        <div id="panel-page-node" class="panel-page active">
          <div id="node-panel-empty" class="panel-empty-hint">选择一个节点以编辑样式</div>
          <div id="node-panel-content" class="panel-page-content hidden">
            <div class="panel-section">
              <label class="panel-label" for="inspector-size">字号</label>
              <select id="inspector-size" class="panel-select">
                <option value="">默认</option>
                <option value="16px">16</option>
              </select>
            </div>
            <div class="panel-section">
              <label class="panel-label">颜色</label>
              <input type="color" id="inspector-color" class="panel-color" value="#000000" />
            </div>
            <div class="panel-section">
              <label class="panel-label" for="inspector-hyperlink">超链接</label>
              <input type="url" id="inspector-hyperlink" class="panel-input" placeholder="https://example.com" />
            </div>
            <div class="panel-section">
              <label class="panel-label" for="inspector-note">注释</label>
              <textarea id="inspector-note" class="panel-textarea" rows="3"></textarea>
            </div>
            <div class="panel-section">
              <label class="panel-label" for="inspector-ai-note">AI 备注</label>
              <textarea id="inspector-ai-note" class="panel-textarea" rows="4" placeholder="仅提供给 AI 的背景、目标和约束"></textarea>
            </div>
            <p class="panel-hint">节点文字支持 Markdown：**粗体**、*斜体*、[链接](url)、$E=mc^2$</p>
          </div>
        </div>
        <div id="panel-page-theme" class="panel-page">
          <div class="panel-section">
            <select id="theme-select" class="panel-select"></select>
            <select id="direction-select" class="panel-select"></select>
            <select id="line-style-select" class="panel-select"></select>
            <select id="bg-pattern-select" class="panel-select">
              <option value="none">无</option>
              <option value="dots">点阵</option>
              <option value="grid">网格</option>
              <option value="crossDot">十字点</option>
            </select>
            <input id="bg-pattern-color" class="panel-color" type="color" value="#808080" />
            <input id="bg-pattern-opacity" class="style-opacity" type="range" min="5" max="100" step="5" value="5" />
            <span id="bg-pattern-opacity-value" class="style-opacity-value">5%</span>
          </div>
        </div>
      </div>
    </aside>
  </div>
  <div id="debug-bar">loading...</div>

  <script>
    window.__TEST__ = { logs: [], errors: [], done: false, passed: false };

    function log(msg, ok) {
      window.__TEST__.logs.push({ msg, ok });
      const el = document.getElementById('debug-bar');
      const line = document.createElement('div');
      line.className = ok ? 'pass' : 'fail';
      line.textContent = (ok ? '✓ ' : '✗ ') + msg;
      el.appendChild(line);
    }

    window.addEventListener('error', (e) => {
      window.__TEST__.errors.push(e.message || String(e.error));
      log('uncaught: ' + (e.message || e.error), false);
    });

    const defaultDoc = {
      nodeData: {
        id: 'root',
        topic: 'Central Topic',
        root: true,
        children: [{
          id: 'child',
          topic: 'Child Topic',
          note: 'Persistent note',
          children: [{
            id: 'grandchild',
            topic: 'Grandchild Topic',
            children: [{ id: 'great-grandchild', topic: 'Great-grandchild Topic', children: [] }],
          }],
        }],
      },
      arrows: [],
      themeTemplate: 'clayLight',
      backgroundPattern: 'grid',
      bgPatternColor: '#808080',
      bgPatternOpacity: 5,
      direction: 1,
      lineStyle: 'curve',
    };

    function acquireVsCodeApi() {
      return {
        getState: () => ({}),
        setState: () => {},
        postMessage: (msg) => { window.__TEST__.lastMessage = msg; },
      };
    }

    async function runTests() {
      document.getElementById('debug-bar').textContent = '';
      log('MindElixir loaded: ' + !!window.MindElixir, !!window.MindElixir);

      await new Promise((r) => setTimeout(r, 100));
      window.postMessage({ type: 'update', text: JSON.stringify(defaultDoc), images: {} }, '*');
      await new Promise((r) => setTimeout(r, 300));

      log('mind map rendered', !!document.querySelector('me-tpc'));
      const notedTopic = Array.from(document.querySelectorAll('me-tpc'))
        .find((topic) => topic.nodeObj?.id === 'child');
      log('note marker rendered', notedTopic?.classList.contains('has-note') === true);
      notedTopic?.click();
      await new Promise((r) => setTimeout(r, 50));
      log('note marker survives selection', notedTopic?.classList.contains('has-note') === true);
      log('note marker offset from node', notedTopic
        && getComputedStyle(notedTopic, '::after').right === '-14px'
        && getComputedStyle(notedTopic, '::after').top === '-7px');
      const collapseControls = Array.from(document.querySelectorAll('me-epd.minus'));
      log('collapse controls vertically centered', collapseControls.length >= 2 && collapseControls.every((control) => {
        const controlRect = control.getBoundingClientRect();
        const parentRect = control.parentElement.getBoundingClientRect();
        const controlCenter = controlRect.top + controlRect.height / 2;
        const parentCenter = parentRect.top + parentRect.height / 2;
        return Math.abs(controlCenter - parentCenter) < 1;
      }));
      log('side panel starts expanded', !document.getElementById('side-panel').classList.contains('hidden'));

      const aiNoteInput = document.getElementById('inspector-ai-note');
      log('AI note field present', !!aiNoteInput);
      aiNoteInput.value = 'Only consider offline deployment.';
      aiNoteInput.dispatchEvent(new Event('focus'));
      aiNoteInput.dispatchEvent(new Event('blur'));
      await new Promise((r) => setTimeout(r, 50));
      const aiNoteMessage = window.__TEST__.lastMessage;
      log('AI note saved on node', aiNoteMessage?.type === 'change'
        && JSON.parse(aiNoteMessage.text).nodeData.children[0].ai_note === 'Only consider offline deployment.');

      const imageBytes = Uint8Array.from(
        atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9WlOkAAAAASUVORK5CYII='),
        (char) => char.charCodeAt(0),
      );
      const imageTransfer = new DataTransfer();
      imageTransfer.items.add(new File([imageBytes], 'clipboard.png', { type: 'image/png' }));
      document.dispatchEvent(new ClipboardEvent('paste', {
        clipboardData: imageTransfer,
        bubbles: true,
        cancelable: true,
      }));
      await new Promise((r) => setTimeout(r, 300));
      const imagePasteMessage = window.__TEST__.lastMessage;
      log('clipboard image pasted into selected node', imagePasteMessage?.type === 'change'
        && imagePasteMessage.images?.child?.startsWith('data:image/png')
        && !!JSON.parse(imagePasteMessage.text).nodeData.children[0].image);

      const exportTrigger = document.getElementById('export-trigger');
      const mmfExport = document.querySelector('[data-export="mmf"]');
      log('MMF export control present', !!exportTrigger && !!mmfExport);
      log('legacy export controls absent', !document.querySelector('[data-export="json"], [data-export="mdmm"]'));
      if (exportTrigger && mmfExport) {
        exportTrigger.click();
        mmfExport.click();
        await new Promise((r) => setTimeout(r, 50));
        const message = window.__TEST__.lastMessage;
        log('MMF export emits .mmf MindElixir JSON',
          message?.type === 'exportFile'
          && message?.format === 'mmf'
          && message?.defaultName === 'mindmap.mmf'
          && JSON.parse(message.text).nodeData.topic === 'Central Topic');
      }

      document.getElementById('btn-close-panel').click();
      await new Promise((r) => setTimeout(r, 50));
      log('side panel collapses', document.getElementById('side-panel').classList.contains('hidden'));

      window.postMessage({ type: 'toggleSidePanel' }, '*');
      await new Promise((r) => setTimeout(r, 50));
      log('side panel expands via message', !document.getElementById('side-panel').classList.contains('hidden'));

      const panel = document.getElementById('side-panel');
      const resizer = document.getElementById('side-panel-resizer');
      const startWidth = panel.offsetWidth;
      resizer.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: window.innerWidth - startWidth - 40 }));
      document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: window.innerWidth - startWidth - 80 }));
      document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
      await new Promise((r) => setTimeout(r, 50));
      log('side panel resizes wider', panel.offsetWidth > startWidth);

      document.getElementById('panel-tab-theme').click();
      await new Promise((r) => setTimeout(r, 50));
      log('global tab label', document.getElementById('panel-tab-theme').textContent.trim() === '全局');
      log('theme tab active', document.getElementById('panel-page-theme').classList.contains('active'));

      const select = document.getElementById('theme-select');
      select.value = 'auroraDark';
      select.dispatchEvent(new Event('change'));
      await new Promise((r) => setTimeout(r, 200));
      log('theme switch', !window.__TEST__.errors.length);

      const directionSelect = document.getElementById('direction-select');
      log('layout options populated', directionSelect.options.length >= 3);
      directionSelect.value = '0';
      directionSelect.dispatchEvent(new Event('change'));
      await new Promise((r) => setTimeout(r, 100));
      log('layout switch', !window.__TEST__.errors.length);

      const lineStyleSelect = document.getElementById('line-style-select');
      const lineOptions = Array.from(lineStyleSelect.options)
        .map((option) => [option.value, option.textContent]);
      log('line style options are focused', JSON.stringify(lineOptions) === JSON.stringify([
        ['curve', '流畅曲线'],
        ['straight', '简洁直线'],
        ['elbow', '圆角折线'],
        ['step', '阶梯折线'],
        ['branch', '经典下划线'],
      ]));
      lineStyleSelect.value = 'curve';
      lineStyleSelect.dispatchEvent(new Event('change'));
      await new Promise((r) => setTimeout(r, 100));
      const curvePaths = Array.from(document.querySelectorAll('.lines path, .subLines path'));
      const curvePathData = curvePaths.map((path) => path.getAttribute('d') || '');
      log('smooth curve has no underline segments',
        curvePathData.length > 0 && curvePathData.every((pathData) => !/(^|\s)H(\s|$)/.test(pathData)));
      lineStyleSelect.value = 'branch';
      lineStyleSelect.dispatchEvent(new Event('change'));
      await new Promise((r) => setTimeout(r, 100));
      const branchPathData = Array.from(document.querySelectorAll('.lines path, .subLines path'))
        .map((path) => path.getAttribute('d') || '');
      log('classic underline has underline segments',
        branchPathData.length > 0 && branchPathData.every((pathData) => /(^|\s)H(\s|$)/.test(pathData)));
      for (const value of ['curve', 'straight', 'elbow', 'step', 'branch']) {
        lineStyleSelect.value = value;
        lineStyleSelect.dispatchEvent(new Event('change'));
        await new Promise((r) => setTimeout(r, 100));
      }
      log('line style switching', !window.__TEST__.errors.length);

      const ltToolbar = document.querySelector('.mind-elixir-toolbar.lt');
      log('left toolbar hidden', !ltToolbar || getComputedStyle(ltToolbar).display === 'none');

      const overlay = document.getElementById('bgPatternOverlay');
      const patternSelect = document.getElementById('bg-pattern-select');
      patternSelect.value = 'dots';
      patternSelect.dispatchEvent(new Event('change'));
      log('bg pattern dots', overlay.style.backgroundImage.includes('radial-gradient'));

      const noErrors = window.__TEST__.errors.length === 0;
      const allChecksPassed = window.__TEST__.logs.every((entry) => entry.ok);
      window.__TEST__.done = true;
      window.__TEST__.passed = noErrors && allChecksPassed;
      log(window.__TEST__.passed ? 'ALL TESTS PASSED' : 'TESTS FAILED', window.__TEST__.passed);
    }
  </script>
  <script src="../media/MindElixir.js"></script>
  <script src="../media/main.js"></script>
  <script>window.addEventListener('load', () => runTests());</script>
</body>
</html>
